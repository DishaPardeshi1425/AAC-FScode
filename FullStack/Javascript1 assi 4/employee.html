<!DOCTYPE html>
<html>
<head>
    <title>Employee Object Manipulation</title>
</head>
<body>

    <h2>Employee Management System</h2>

    <button onclick="displayEmployees()">Display All Employees</button>
    <button onclick="findByDepartment()">Find by Department</button>
    <button onclick="averageSalary()">Average Salary</button>
    <button onclick="highestSalary()">Highest Salary</button>

    <div id="output"></div>

    <script>
        // Array of employee objects
        let employees = [
            { id: 1, name: "Rahul", department: "IT", salary: 50000 },
            { id: 2, name: "Priya", department: "HR", salary: 40000 },
            { id: 3, name: "Amit", department: "IT", salary: 60000 },
            { id: 4, name: "Sneha", department: "Finance", salary: 45000 },
            { id: 5, name: "Rohan", department: "HR", salary: 35000 }
        ];

        // 1. Display all employees
        function displayEmployees() {
            let result = "<h3>All Employees</h3>";

            for (let i = 0; i < employees.length; i++) {
                result += "ID: " + employees[i].id +
                    ", Name: " + employees[i].name +
                    ", Department: " + employees[i].department +
                    ", Salary: ₹" + employees[i].salary + "<br>";
            }

            document.getElementById("output").innerHTML = result;
        }

        // 2. Find employees by department
        function findByDepartment() {
            let department = prompt("Enter department (IT, HR, Finance):");
            let result = "<h3>Employees in " + department + " Department</h3>";
            let found = false;

            for (let i = 0; i < employees.length; i++) {
                if (employees[i].department.toLowerCase() === department.toLowerCase()) {
                    result += employees[i].name + " - Salary: ₹" +
                        employees[i].salary + "<br>";
                    found = true;
                }
            }

            if (found === false) {
                result += "No employees found.";
            }

            document.getElementById("output").innerHTML = result;
        }

        // 3. Calculate average salary
        function averageSalary() {
            let total = 0;

            for (let i = 0; i < employees.length; i++) {
                total += employees[i].salary;
            }

            let average = total / employees.length;

            document.getElementById("output").innerHTML =
                "<h3>Average Salary: ₹" + average.toFixed(2) + "</h3>";
        }

        // 4. Find employee with the highest salary
        function highestSalary() {
            let highest = employees[0];

            for (let i = 1; i < employees.length; i++) {
                if (employees[i].salary > highest.salary) {
                    highest = employees[i];
                }
            }

            document.getElementById("output").innerHTML =
                "<h3>Employee with Highest Salary</h3>" +
                "Name: " + highest.name + "<br>" +
                "Department: " + highest.department + "<br>" +
                "Salary: ₹" + highest.salary;
        }
    </script>

</body>
</html>
