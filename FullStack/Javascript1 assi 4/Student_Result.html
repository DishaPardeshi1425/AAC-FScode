<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management System</title>
</head>
<body>

    <h2>Student Result Management System</h2>

    <label>Student Name:</label>
    <input type="text" id="name"><br><br>

    <label>Subject 1 Marks:</label>
    <input type="number" id="m1" min="0" max="100"><br><br>

    <label>Subject 2 Marks:</label>
    <input type="number" id="m2" min="0" max="100"><br><br>

    <label>Subject 3 Marks:</label>
    <input type="number" id="m3" min="0" max="100"><br><br>

    <button onclick="showResult()">Calculate Result</button>

    <div id="output"></div>

    <script>
        // Function to calculate total marks
        function calculateTotal(m1, m2, m3) {
            return m1 + m2 + m3;
        }

        // Function to calculate percentage
        function calculatePercentage(total) {
            return (total / 300) * 100;
        }

        // Function to calculate grade
        function calculateGrade(percentage) {
            if (percentage >= 90) {
                return "A+";
            } else if (percentage >= 75) {
                return "A";
            } else if (percentage >= 60) {
                return "B";
            } else if (percentage >= 40) {
                return "C";
            } else {
                return "F";
            }
        }

        // Function to check pass or fail
        function checkResult(m1, m2, m3) {
            if (m1 >= 35 && m2 >= 35 && m3 >= 35) {
                return "Pass";
            } else {
                return "Fail";
            }
        }

        // Function calling
        function showResult() {
            let name = document.getElementById("name").value;

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            if (name.trim() === "" ||
                document.getElementById("m1").value === "" ||
                document.getElementById("m2").value === "" ||
                document.getElementById("m3").value === "" ||
                m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100) {

                alert("Please enter a name and valid marks between 0 and 100.");
                return;
            }

            let total = calculateTotal(m1, m2, m3);
            let percentage = calculatePercentage(total);
            let grade = calculateGrade(percentage);
            let status = checkResult(m1, m2, m3);

            document.getElementById("output").innerHTML =
                "<h3>Student Result</h3>" +
                "Name: " + name + "<br>" +
                "Total Marks: " + total + " / 300<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade + "<br>" +
                "Result: " + status;
        }
    </script>

</body>
</html>
