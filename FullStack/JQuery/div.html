<!DOCTYPE html>
<html>
<head>
    <title>Div, Span and Buttons</title>

    <style>
        .main {
            width: 30%;
            border: 2px solid black;
            padding: 20px;
        }

        .box1 {
            width: 80%;
            height: 100px;
            border: 2px solid black;
            padding: 10px;
            margin-top: 15px;
        }

        .box2 {
            width: 80%;
            border: 2px solid black;
            padding: 10px;
            margin-top: 15px;
        }

        span {
            display: block;
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="main">

        Computer Science Department

        <div class="box1">
            First Inner Div
        </div>

        <div class="box2">
            <span>Span 1</span>
            <span>Span 2</span>
            <span>Span 3</span>
            <span>Span 4</span>
        </div>

        <button>Button 1</button>
        <button>Button 2</button>
        <button>Button 3</button>
        <button>Button 4</button>
        <button>Button 5</button>
        <button>Button 6</button>
        <button>Button 7</button>

    </div>

</body>
</html>
